<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>康复音游 - Rehab Rhythm</title>
  </head>
  <body>
    <div id="ui-container">
      <div class="header">
        <div class="settings">
          <div class="setting-item">
            <label for="songSelect">🎵 选择歌曲</label>
            <select id="songSelect">
            </select>
          </div>
          <div class="setting-item">
            <label for="densityRange">⚡ 练习难度: <span id="densityValue">中等</span></label>
            <input type="range" id="densityRange" min="1" max="4" value="3" step="1">
          </div>
          <div class="setting-item">
            <label for="volumeRange">🔊 音乐音量: <span id="volumeValue">50</span>%</label>
            <input type="range" id="volumeRange" min="0" max="100" value="50">
          </div>
        </div>
        <div style="display:flex; gap:12px; align-items:center;">
          <button id="pauseBtn" class="action-btn">⏸ 暂停游戏</button>
        </div>
      </div>

      <div id="game-wrapper">
        <div id="app"></div>
        
        <!-- 覆盖层：开始界面 -->
        <div id="start-overlay" class="overlay">
          <div class="overlay-content">
            <div style="position:absolute; right:16px; top:16px;">
              <button id="userBtn" class="main-btn">用户</button>
            </div>
            <h2>准备好开始演奏了吗？</h2>
            <p>使用 <strong>D, F, J, K</strong> 键击打音符</p>
            <button id="startBtn" class="main-btn">开始游戏</button>
          </div>
        </div>

        <!-- 覆盖层：暂停界面 -->
        <div id="pause-overlay" class="overlay hidden">
          <div class="overlay-content">
            <h2>游戏已暂停</h2>
            <p>您可以调整上方设置，或休息一下</p>
            <button id="resumeBtn" class="main-btn">继续游戏</button>
            <button id="endBtn" class="main-btn">结束游戏</button>
          </div>
        </div>

        <!-- 覆盖层：游戏结束界面 -->
        <div id="game-over-overlay" class="overlay hidden">
          <div class="overlay-content">
            <h2>训练结束！</h2>
            <div class="final-score-container">
              <span class="score-label">本次得分</span>
              <span id="finalScore" class="score-value">0</span>
            </div>
            <p id="evaluationText">很棒的尝试！继续坚持！</p>
            <button id="restartBtn" class="main-btn">再来一局</button>
            <button id="returnHomeBtn" class="main-btn" style="margin-left:8px;">返回主页</button>
          </div>
        </div>
      </div>
        
      <!-- 覆盖层：用户管理界面 -->
      <div id="user-overlay" class="overlay hidden">
        <div class="overlay-content user-panel-content">
          <div class="user-panel-header">
            <h2>👤 用户中心</h2>
            <button id="userCloseBtn" class="close-icon-btn">×</button>
          </div>

          <div class="user-selection-area">
            <div class="field-group">
              <label for="userManageSelect">切换当前训练者</label>
              <div class="select-wrapper">
                <select id="userManageSelect" class="large-select"></select>
              </div>
            </div>
            <div class="user-action-group">
              <button id="userNewBtn" class="sub-btn primary">✨ 新建</button>
              <button id="userDeleteBtn" class="sub-btn danger">🗑️ 删除</button>
            </div>
          </div>

          <div id="userManageForm" class="user-form-panel hidden">
            <h3>创建新用户</h3>
            <div class="form-grid">
              <div class="form-item full">
                <label>姓名</label>
                <input id="mUserName" placeholder="请输入姓名" />
              </div>
              <div class="form-item">
                <label>性别</label>
                <select id="mUserSex">
                  <option value="">未指定</option>
                  <option value="male">男</option>
                  <option value="female">女</option>
                  <option value="other">其他</option>
                </select>
              </div>
              <div class="form-item">
                <label>年龄</label>
                <input id="mUserAge" type="number" min="0" max="120" placeholder="岁" />
              </div>
              <div class="form-item">
                <label>主用手</label>
                <select id="mUserHand">
                  <option value="">未指定</option>
                  <option value="left">左手</option>
                  <option value="right">右手</option>
                  <option value="both">双手</option>
                </select>
              </div>
              <div class="form-item">
                <label>康复阶段</label>
                <input id="mUserPhase" placeholder="如：早期" />
              </div>
            </div>
            <div id="mUserMsg" class="form-msg"></div>
            <div class="form-actions">
              <button id="mUserCreateBtn" class="sub-btn primary">确认保存</button>
            </div>
          </div>

          <div class="user-info-card">
            <div id="userInfoText" class="info-grid"></div>
          </div>

          <div class="user-records-section">
            <h3>📈 历史训练记录</h3>
            <div id="userSessions" class="records-list"></div>
          </div>
        </div>
      </div>

      <div class="instructions">建议佩戴康复手套或使用键盘 D, F, J, K 进行练习</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
